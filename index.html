<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài Tập 1404</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    .nav {
      display: grid;
      grid-template-areas: "hamburget logo";
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
      text-align: center;
    }
    .hamburget {
      display: block;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      padding: 20px;
      grid-area: hamburget;
    }
    .logo {
      grid-area: logo;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .menu {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 80px;
      left: 0;
      background-color: #fff;
      z-index: 100;
    }
    .menu a {
      margin: 10px 20px;
      text-decoration: none;
      color: black;
      font-size: 14px;
    }
    #check:checked ~ .menu {
      display: flex;
    }
    .content {
      text-align: center;
      padding: 20px;
    }
    .content img {
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="nav">
    <label for="check" class="hamburget">&#9776;</label>
    <div class="logo"><h2>Bài Tập 1404</h2></div>
    <input type="checkbox" id="check" style="display: none;">
    <div class="menu">
      <a href="#">Trang chủ</a>
      <a href="#">Giới thiệu</a>
      <a href="#">Liên hệ</a>
    </div>
  </div>

  <div class="content">
    <h1>Hình ảnh bài tập</h1>
    <img src="baitap1404.png" alt="Ảnh bài tập">
  </div>
</body>
</html>
